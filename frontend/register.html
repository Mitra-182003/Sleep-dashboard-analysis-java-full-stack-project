<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | DreamBetter</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/auth.css"><style>.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1.55fr}.auth-visual{background:linear-gradient(150deg,#08285a,#0b4b9b);color:white;padding:55px;display:flex;flex-direction:column;justify-content:space-between}.auth-visual h1{font-size:28px}.auth-visual p{color:#bfd4f5;line-height:1.6;max-width:280px}.auth-form{max-width:630px;margin:auto;width:calc(100% - 50px)}.auth-form h2{color:var(--navy);margin:4px 0}.auth-form>p{color:var(--muted);font-size:11px;margin-bottom:24px}.auth-form .btn{width:100%;margin-top:18px}</style></head><body><div class="auth"><div class="auth-visual"><a class="brand" href="index.html"><span class="brand-mark">☾</span><div><strong>DreamBetter</strong><small>Better Sleep · Healthier You</small></div></a><div><h1>Your best sleep<br>starts here.</h1><p>Create your free account and make every night count.</p></div><div class="mountain">✦</div></div><main class="auth-form"><div class="eyebrow">DreamBetter</div><h2>Create your account</h2><p>Join thousands of people improving their sleep, one night at a time.</p><form data-auth="register"><div class="form-grid"><div class="field full"><label for="register-name">Full name</label><input id="register-name" required placeholder="Niyathi Marella"></div><div class="field full"><label for="register-email">Email address</label><input id="register-email" type="email" required placeholder="you@example.com"></div><div class="field"><label for="register-password">Password</label><input id="register-password" type="password" minlength="6" required placeholder="At least 6 characters"></div><div class="field"><label for="register-confirm-password">Confirm password</label><input id="register-confirm-password" type="password" minlength="6" required placeholder="Repeat password"></div></div><label class="muted"><input type="checkbox" required> I agree to the Terms of Service and Privacy Policy</label><button class="btn btn-primary" type="submit">Create account with email</button><div class="auth-divider"><span>or</span></div><button class="btn btn-google" type="button" data-google-sign-in><span aria-hidden="true">G</span> Continue with Google</button></form><div class="auth-links">Already have an account? <a href="login.html">Sign in</a></div></main></div><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></body></html>
