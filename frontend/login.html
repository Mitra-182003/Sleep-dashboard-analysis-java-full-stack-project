<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | DreamBetter</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/auth.css"><style>.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-visual{background:linear-gradient(150deg,#08285a,#0b4b9b);color:white;padding:55px;display:flex;flex-direction:column;justify-content:space-between}.auth-visual h1{max-width:270px;font-size:28px;line-height:1.2}.auth-visual p{max-width:290px;color:#bfd4f5;line-height:1.6}.mountain{font-size:110px;opacity:.4}.auth-form{max-width:410px;margin:auto;width:calc(100% - 50px)}.auth-form h2{color:var(--navy);margin:0 0 6px}.auth-form>p{color:var(--muted);font-size:11px;margin-bottom:25px}.auth-form .field{margin-bottom:15px}.auth-form .btn{width:100%;margin-top:8px}.auth-links{text-align:center;color:var(--muted);font-size:10px;margin-top:17px}.auth-links a{color:var(--blue);font-weight:700}</style></head><body><div class="auth"><div class="auth-visual"><a class="brand" href="index.html"><span class="brand-mark">☾</span><div><strong>DreamBetter</strong><small>Better Sleep · Healthier You</small></div></a><div><h1>Better Sleep.<br>Brighter Tomorrow.</h1><p>Track your sleep, understand your patterns, and build healthier habits for a happier you.</p></div><div class="mountain">☾</div></div><main class="auth-form"><div class="eyebrow">Welcome back</div><h2>Sign in to your account</h2><p>Continue your journey to better sleep.</p><form data-auth="login"><div class="field"><label for="login-email">Email address</label><input id="login-email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" type="password" placeholder="••••••••" required></div><button class="btn btn-primary" type="submit">Sign in with email</button><div class="auth-divider"><span>or</span></div><button class="btn btn-google" type="button" data-google-sign-in><span aria-hidden="true">G</span> Continue with Google</button></form><div class="auth-links">Don't have an account? <a href="register.html">Register</a></div></main></div><div class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></body></html>
