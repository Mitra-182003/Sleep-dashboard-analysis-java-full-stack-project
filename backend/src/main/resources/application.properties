spring.application.name=dreambetter-api
server.port=8080
spring.config.import=optional:file:./.env[.properties]
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.frontend-url=${FRONTEND_URL:http://localhost:5500}
app.supabase.url=${SUPABASE_URL}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=${SUPABASE_DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
app.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
server.error.include-message=never
server.error.include-stacktrace=never
